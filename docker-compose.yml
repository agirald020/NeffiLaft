services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image:  "208202859881.dkr.ecr.us-east-2.amazonaws.com/neffilaft-backend:latest"
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8091
      - JAVA_OPTS=-Duser.timezone=UTC
    container_name: neffi-backend
    networks:
      - neffi-network
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image:  "994656208736.dkr.ecr.us-west-2.amazonaws.com/neffilaft:backend-latest"
    ports:
      - "8091:8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8091
      - JAVA_OPTS=-Duser.timezone=UTC
    container_name: neffi-backend
    networks:
      - neffi-network
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: "208202859881.dkr.ecr.us-east-2.amazonaws.com/neffilaft-frontend:latest"
    ports:
      - "5010:5010"
    container_name: neffi-frontend
    networks:
      - neffi-network
    environment:
      - REACT_APP_API_URL=http://backend:8091
    depends_on:
      - backend
    stdin_open: true
    tty: true
  frontend-prod:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: "994656208736.dkr.ecr.us-west-2.amazonaws.com/neffilaft:frontend-latest"
    ports:
      - "5010:5010"
    container_name: neffi-frontend
    networks:
      - neffi-network
    environment:
      - REACT_APP_API_URL=http://backend:8091
    depends_on:
      - backend
    stdin_open: true
    tty: true
networks:
  neffi-network:
    driver: bridge
